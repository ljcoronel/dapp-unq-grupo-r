openapi: 3.0.3
info:
  title: API de gestion de API Keys
  version: 1.0.0
  description: Operaciones para crear, consultar y revocar claves de API propias.
servers:
  - url: /
    description: Mismo origen donde se sirve la API.
security:
  - bearerAuth: []
  - apiKeyAuth: []
paths:
  /api-keys:
    post:
      tags: [API Keys]
      summary: Crear una API Key
      description: Requiere JWT. Devuelve el secreto completo solo en esta respuesta.
      operationId: createApiKey
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApiKeyCreateRequest'
      responses:
        '201':
          description: Clave creada; el secreto solo vuelve a mostrarse en esta respuesta.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiKeyCreated'
        '400':
          description: Nombre o vencimiento invalido.
        '401':
          description: Falta JWT o no es valido.
    get:
      tags: [API Keys]
      summary: Listar las API Keys propias
      description: Requiere JWT. La respuesta contiene metadatos y nunca secretos ni hashes.
      operationId: listApiKeys
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Metadatos de las claves del usuario autenticado.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ApiKeyMetadata'
        '401':
          description: Falta JWT o no es valido.
  /api-keys/{id}:
    delete:
      tags: [API Keys]
      summary: Revocar una API Key propia
      description: Requiere JWT. No elimina el registro y no puede reactivar la clave.
      operationId: revokeApiKey
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Selector UUID de la clave propia.
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Clave revocada.
        '401':
          description: Falta JWT o no es valido.
        '404':
          description: Clave inexistente o no pertenece al usuario autenticado.
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    apiKeyAuth:
      type: apiKey
      in: header
      name: x-api-key
  schemas:
    ApiKeyCreateRequest:
      type: object
      required: [label]
      properties:
        label:
          type: string
          minLength: 1
          maxLength: 80
          description: Nombre descriptivo; se recortan espacios exteriores.
          example: cliente-integracion
        expiresAt:
          type: string
          format: date-time
          nullable: true
          description: Vencimiento opcional posterior al instante de creacion.
    ApiKeyCreated:
      type: object
      required: [id, label, key, createdAt]
      properties:
        id:
          type: string
          format: uuid
        label:
          type: string
        key:
          type: string
          writeOnly: true
          description: Secreto mostrado una sola vez. No se almacena ni se vuelve a devolver.
        createdAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time
          nullable: true
    ApiKeyMetadata:
      type: object
      required: [id, label, createdAt, revoked]
      properties:
        id:
          type: string
          format: uuid
        label:
          type: string
        createdAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time
          nullable: true
        revokedAt:
          type: string
          format: date-time
          nullable: true
        revoked:
          type: boolean
