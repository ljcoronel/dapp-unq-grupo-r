openapi: 3.0.3
info:
  title: API de ranking global de jugadores
  version: 1.0.0
  description: Consulta consolidada de cotizaciones vigentes y ranking paginado.
servers:
  - url: /
tags:
  - name: Ranking
paths:
  /players/ranking:
    get:
      tags: [Ranking]
      summary: Obtener ranking global paginado
      operationId: getPlayerRanking
      security: []
      parameters:
        - name: page
          in: query
          required: false
          schema: { type: integer, minimum: 1, default: 1 }
        - name: limit
          in: query
          required: false
          description: Cantidad de filas por pagina.
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
        - name: league
          in: query
          required: false
          schema: { type: string, minLength: 1, maxLength: 100 }
        - name: team
          in: query
          required: false
          schema: { type: string, minLength: 1, maxLength: 100 }
        - name: position
          in: query
          required: false
          schema: { type: string, minLength: 1, maxLength: 100 }
      responses:
        '200':
          description: Ranking filtrado y paginado.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RankingPage' }
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalServerError'
components:
  responses:
    BadRequest:
      description: Parametros invalidos.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    InternalServerError:
      description: Error interno uniforme.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
  schemas:
    RankingPage:
      type: object
      required: [items, total, page, limit]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/RankingPlayer' }
        total: { type: integer, minimum: 0 }
        page: { type: integer, minimum: 1 }
        limit: { type: integer, minimum: 1, maximum: 100 }
    RankingPlayer:
      type: object
      required: [position, playerId, name, team, league, positionInField, representativeValue, origin]
      properties:
        position: { type: integer, minimum: 1 }
        playerId: { type: integer, format: int64 }
        name: { type: string }
        team: { type: string }
        league: { type: string }
        positionInField: { type: string }
        representativeValue: { type: number, format: double, minimum: 0 }
        origin:
          type: string
          enum: [ESTRATEGIA_A, ESTRATEGIA_B, "Cotizacion base"]
    ErrorResponse:
      type: object
      required: [message]
      properties:
        message: { type: string }
