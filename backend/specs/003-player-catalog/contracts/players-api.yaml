openapi: 3.0.3
info:
  title: Catálogo de jugadores
  version: 1.0.0
  description: Consulta el snapshot de jugadores almacenado localmente.
servers:
  - url: http://localhost:8080
paths:
  /players:
    get:
      summary: Obtener jugadores agrupados por liga
      description: >
        Devuelve siempre cinco listas en el orden fijo de ligas. La lectura usa
        exclusivamente el snapshot de PostgreSQL; no dispara requests externas.
        Este endpoint es público y no requiere token JWT. Cada lista representa
        una sección independiente que el consumidor puede expandir o contraer
        sin modificar las demás; todas deben iniciar expandidas. El control de
        cada sección debe exponer su estado expandido mediante aria-expanded y
        asociarse de forma accesible con el contenido de la liga. Las listas
        vacías se mantienen como arrays vacíos para conservar las cinco
        posiciones estables.
      responses:
        '200':
          description: Cinco listas de hasta diez jugadores cada una
          content:
            application/json:
              schema:
                type: array
                minItems: 5
                maxItems: 5
                items:
                  type: array
                  maxItems: 10
                  items:
                    $ref: '#/components/schemas/Player'
        '503':
          description: El catálogo no está disponible
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /players/{id}:
    get:
      summary: Obtener un jugador por identificador
      description: >
        Devuelve un único jugador almacenado en PostgreSQL. El endpoint es
        público y no requiere token JWT.
      parameters:
        - name: id
          in: path
          required: true
          description: Identificador entero positivo del jugador
          schema:
            type: integer
            format: int64
            minimum: 1
      responses:
        '200':
          description: Jugador encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Player'
        '404':
          description: No existe un jugador con ese identificador
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '400':
          description: El identificador no es un entero positivo
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
components:
  schemas:
    Player:
      type: object
      required: [id, nombre, equipo, liga]
      properties:
        id:
          type: integer
          format: int32
          minimum: 1
          description: Valor de player.id recibido desde football-data y usado como PRIMARY KEY
        nombre: { type: string }
        seccion: { type: string, nullable: true }
        equipo: { type: string }
        liga:
          type: object
          required: [codigo, nombre, pais]
          properties:
            codigo: { type: string }
            nombre: { type: string }
            pais: { type: string }
        partidosJugados: { type: integer, nullable: true }
        goles: { type: integer, nullable: true }
        asistencias: { type: integer, nullable: true }
        penaltis: { type: integer, nullable: true }
    Error:
      type: object
      required: [mensaje]
      properties:
        mensaje: { type: string }
