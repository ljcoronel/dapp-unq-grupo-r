spring.application.name=dapp-unq-grupo-r

spring.datasource.url=jdbc:postgresql://localhost:5432/dappfc
spring.datasource.username=postgres
spring.datasource.password=root
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false
spring.jackson.default-property-inclusion=non_null

jwt.secret=dapp-unq-grupo-r-secret-key-2026-09-08-must-be-at-least-256-bit-long
jwt.expiration-ms=3600000

springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.url=/openapi.yaml
springdoc.swagger-ui.operations-sort=method
springdoc.swagger-ui.tags-sorter=alpha
springdoc.override-with-generic-response=false
springdoc.show-actuator=false
springdoc.api-docs.path=/v3/api-docs
springdoc.writer-with-default-pretty-printer=true
spring.task.scheduling.time-zone=America/Argentina/Buenos_Aires
valuation.weekly.cron=0 0 3 ? * SUN
valuation.players-limit=50
springdoc.swagger-ui.persist-authorization=true
